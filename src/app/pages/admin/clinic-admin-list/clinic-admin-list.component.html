<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Clinic Admins</h1>
    <button
      (click)="openModal()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors"
    >
      + Add Clinic Admin
    </button>
  </div>

  <div class="mb-6">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="filterAdmins()"
      placeholder="Search by name or email..."
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
    />
  </div>

  <div *ngIf="isLoading" class="text-center py-12">
    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
    <p class="mt-4 text-gray-600">Loading clinic admins...</p>
  </div>

  <div *ngIf="!isLoading && filteredAdmins.length === 0" class="text-center py-12">
    <p class="text-gray-600">No clinic admins found</p>
  </div>

  <div *ngIf="!isLoading && filteredAdmins.length > 0" class="bg-white rounded-lg shadow overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let admin of filteredAdmins" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ admin.id }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm font-medium text-gray-900">{{ admin.firstName }} {{ admin.lastName }}</div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">{{ admin.email }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">{{ admin.phone }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
            {{ admin.createdAt ? (admin.createdAt | date: 'short') : 'N/A' }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm">
            <button
              (click)="deleteClinicAdmin(admin.id)"
              class="text-red-600 hover:text-red-900 font-medium"
            >
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div
  *ngIf="showModal"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  (click)="closeModal()"
>
  <div
    class="bg-white rounded-lg p-8 max-w-md w-full mx-4"
    (click)="$event.stopPropagation()"
  >
    <h2 class="text-2xl font-bold mb-6">Add Clinic Admin</h2>
    
    <form (ngSubmit)="createClinicAdmin()">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">First Name *</label>
        <input
          type="text"
          [(ngModel)]="adminForm.firstName"
          name="firstName"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Last Name *</label>
        <input
          type="text"
          [(ngModel)]="adminForm.lastName"
          name="lastName"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
        <input
          type="email"
          [(ngModel)]="adminForm.email"
          name="email"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Password *</label>
        <input
          type="password"
          [(ngModel)]="adminForm.password"
          name="password"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
        <input
          type="tel"
          [(ngModel)]="adminForm.phone"
          name="phone"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <div class="flex gap-3">
        <button
          type="button"
          (click)="closeModal()"
          class="flex-1 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
        >
          Create
        </button>
      </div>
    </form>
  </div>
</div>
