<div class="min-h-screen bg-gray-50">
  <!-- Page Header -->
  <div class="bg-white py-16">
    <div class="max-w-4xl mx-auto px-8 text-center">
      <h1 class="text-4xl font-bold text-gray-900 mb-4">Browse Clinics</h1>
      <p class="text-lg text-gray-600 mb-8">Find the right clinic for your medical needs</p>
      
      <!-- Search and Filter Bar -->
      <div class="max-w-3xl mx-auto">
        <div class="flex gap-3">
          <!-- Search Input -->
          <div class="relative flex-1">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </div>
            <input 
              type="text" 
              [(ngModel)]="searchTerm"
              (input)="filterClinics()"
              placeholder="Search by name, city..." 
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
            >
          </div>

          <!-- Specialty Filter Dropdown -->
          <div class="relative">
            <button
              type="button"
              (click)="toggleSpecialtyDropdown()"
              class="px-4 py-3 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent flex items-center gap-2 min-w-[200px] justify-between">
              <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
                </svg>
                <span class="text-sm font-medium text-gray-700">
                  {{ selectedSpecialty || 'All Specialties' }}
                </span>
              </div>
              <svg class="w-4 h-4 text-gray-400 transition-transform" 
                   [class.rotate-180]="isSpecialtyDropdownOpen"
                   fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div *ngIf="isSpecialtyDropdownOpen" 
                 class="absolute z-10 mt-2 w-72 bg-white border border-gray-300 rounded-lg shadow-lg max-h-96 overflow-y-auto right-0">
              
              <!-- All Specialties Option -->
              <button
                type="button"
                (click)="clearSpecialtyFilter()"
                class="w-full px-4 py-3 text-left hover:bg-gray-50 focus:outline-none focus:bg-gray-50 flex items-center justify-between"
                [class.bg-cyan-50]="!selectedSpecialty"
                [class.text-cyan-700]="!selectedSpecialty">
                <span class="font-medium">All Specialties</span>
                <svg *ngIf="!selectedSpecialty" 
                     class="w-5 h-5 text-cyan-600" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              </button>

              <div class="border-t border-gray-200"></div>

              <!-- Specialty Options -->
              <button
                *ngFor="let specialty of specialties"
                type="button"
                (click)="selectSpecialty(specialty)"
                class="w-full px-4 py-3 text-left hover:bg-gray-50 focus:outline-none focus:bg-gray-50 flex items-center justify-between"
                [class.bg-cyan-50]="selectedSpecialty === specialty.label"
                [class.text-cyan-700]="selectedSpecialty === specialty.label">
                <span>{{ specialty.label }}</span>
                <svg *ngIf="selectedSpecialty === specialty.label" 
                     class="w-5 h-5 text-cyan-600" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Active Filters Display -->
        <div *ngIf="selectedSpecialty || searchTerm" class="mt-4 flex items-center gap-2 justify-center flex-wrap">
          <span class="text-sm text-gray-600">Active filters:</span>
          
          <div *ngIf="selectedSpecialty" class="inline-flex items-center gap-1 bg-cyan-50 text-cyan-700 px-3 py-1 rounded-full text-sm">
            <span>{{ selectedSpecialty }}</span>
            <button 
              (click)="clearSpecialtyFilter()"
              class="hover:bg-cyan-100 rounded-full p-0.5 transition-colors"
              aria-label="Clear specialty filter">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>

          <button 
            (click)="clearAllFilters()"
            class="text-sm text-cyan-600 hover:text-cyan-700 font-medium">
            Clear all
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="max-w-6xl mx-auto px-8 py-12 text-center">
    <p class="text-gray-600">Loading clinics...</p>
  </div>

  <!-- Clinics Grid -->
  <div *ngIf="!loading" class="max-w-6xl mx-auto px-8 py-12">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let clinic of filteredClinics" (click)="navigateToClinic(clinic.id)"  class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-lg transition-shadow cursor-pointer">
        <!-- Clinic Image with Rating -->
        <div class="relative h-48 bg-gray-200">
          <img 
            [src]="clinic.imageUrl || 'assets/clinic-1.jpg'" 
            [alt]="clinic.name" 
            class="w-full h-full object-cover"
            (error)="$any($event.target).src='assets/clinic-1.jpg'"
          >
          <!-- Rating Badge -->
          <div class="absolute top-4 right-4 bg-white rounded-full px-2 py-1 flex items-center gap-1 shadow-sm">
            <svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
            </svg>
            <span class="text-sm font-medium text-gray-900">{{ clinic.rating || 'N/A' }}</span>
          </div>
        </div>

        <!-- Clinic Info -->
        <div class="p-6">
          <!-- Location & Specialty Tags -->
          <div class="flex items-center gap-2 mb-3">
            <span class="inline-flex items-center gap-1 text-sm text-gray-600">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              {{ clinic.city }}
            </span>
            <span class="text-blue-600 text-sm font-medium" *ngIf="clinic.specialties && clinic.specialties.length > 0">{{ clinic.specialties[0].label }}</span>
            <span class="text-blue-600 text-sm font-medium" *ngIf="!clinic.specialties || clinic.specialties.length === 0">General</span>
          </div>

          <!-- Clinic Name -->
          <h3 class="text-xl font-semibold text-gray-900 mb-2">{{ clinic.name }}</h3>

          <!-- Description -->
          <p class="text-gray-600 text-sm leading-relaxed">{{ clinic.description || 'Quality healthcare services' }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
